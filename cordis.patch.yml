- insert:
    - id: aureways
      name: 'dsh-aureways'
      config:
        dataDirectory: './.dsh/aureways'
        idleUnloadMs: 300000
        maxLiveAgents: 8
        maxEphemeralTasks: 4
        leaseDurationMs: 30000
        checkpointEveryTurns: 4
        interruptDecisionTimeoutMs: 60000
        recoveryPolicy: 'pause-on-uncertain'
        runtimeId: 'aureways-local'
